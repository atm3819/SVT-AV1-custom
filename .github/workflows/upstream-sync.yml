name: Check SVT-AV1 upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Merge upstream updates
        id: sync
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/AOMediaCodec/SVT-AV1.git

          UPSTREAM_DEFAULT_BRANCH=$(git ls-remote --symref upstream HEAD | awk '$1 == "ref:" { sub("refs/heads/", "", $2); print $2; exit }')
          if [ -z "$UPSTREAM_DEFAULT_BRANCH" ]; then
            echo "Could not determine the upstream default branch from its HEAD reference." >&2
            exit 1
          fi
          echo "Syncing from upstream default branch: $UPSTREAM_DEFAULT_BRANCH"

          git fetch upstream "$UPSTREAM_DEFAULT_BRANCH"
          git checkout -B upstream-sync "origin/$DEFAULT_BRANCH"
          UPSTREAM_REF=$(git rev-parse FETCH_HEAD)

          if git merge-base --is-ancestor "$UPSTREAM_REF" HEAD; then
            echo "The upstream default branch is already included."
          else
            # Prefer upstream for ordinary conflicts, but preserve this repository's workflow files.
            git merge --no-ff --no-commit -X theirs "$UPSTREAM_REF"
            git restore --source=HEAD --staged --worktree -- .github/workflows/
            git clean -fd -- .github/workflows/
            git commit -m "Sync upstream default branch ($UPSTREAM_DEFAULT_BRANCH)"
          fi

          git push --force origin upstream-sync
