name: Check SVT-AV1 upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Merge upstream updates
        id: sync
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/AOMediaCodec/SVT-AV1.git
          git fetch upstream master
          git checkout -B upstream-sync "origin/$DEFAULT_BRANCH"
          # Resolve conflicting changes in favor of upstream while keeping non-conflicting local changes.
          git merge --no-edit -X theirs upstream/master
          git push --force origin upstream-sync
