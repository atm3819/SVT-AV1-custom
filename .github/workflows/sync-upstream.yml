
name: Sync SVT-AV1 Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream repository
        run: |
          git remote add upstream \
            https://github.com/AOMediaCodec/SVT-AV1.git

      - name: Fetch repositories
        run: |
          git fetch origin
          git fetch upstream

      - name: Detect branches
        id: branches
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          UPSTREAM_BRANCH=$(git ls-remote --symref upstream HEAD \
            | awk '/^ref:/ {
                sub("refs/heads/", "", $2)
                print $2
              }')

          if [ -z "$UPSTREAM_BRANCH" ]; then
            echo "Unable to detect upstream default branch"
            exit 1
          fi

          echo "default=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM_BRANCH" >> "$GITHUB_OUTPUT"

          echo "Fork branch: $DEFAULT_BRANCH"
          echo "Upstream branch: $UPSTREAM_BRANCH"

      - name: Create sync branch
        run: |
          git checkout -B sync-upstream \
            "origin/${{ steps.branches.outputs.default }}"

      - name: Merge upstream
        env:
          UPSTREAM_BRANCH: ${{ steps.branches.outputs.upstream }}
        shell: bash
        run: |
          if git merge "upstream/$UPSTREAM_BRANCH" \
            --no-edit -X theirs; then
            echo "Merge completed successfully"
          else
            if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "Merge failed for a non-conflict reason"
              exit 1
            fi

            echo "Resolving remaining conflicts..."

            while IFS= read -r -d '' file; do
              if [[ "$file" == .github/workflows/* ]]; then
                echo "Preserving fork workflow: $file"
                git checkout --ours -- "$file"
                git add -- "$file"
              elif git checkout --theirs -- "$file"; then
                git add -- "$file"
              else
                git rm -f --ignore-unmatch -- "$file"
              fi
            done < <(git diff --name-only --diff-filter=U -z)

            git add -A
            git commit -m "Merge upstream with automatic conflict resolution"
          fi

      - name: Remove upstream workflow changes
        run: |
          git restore \
            --source=HEAD \
            --staged \
            --worktree \
            .github/workflows/ 2>/dev/null || true

      - name: Push sync branch
        run: |
          git push origin sync-upstream --force-with-lease

      - name: Generate summary
        run: |
          {
            echo "## SVT-AV1 Upstream Sync"
            echo ""
            echo "- Fork: atm3819/svt-av1-custom"
            echo "- Upstream: AOMediaCodec/SVT-AV1"
            echo "- Sync branch: sync-upstream"
            echo "- Default branch: untouched"
            echo "- Workflow files: preserved from fork"
            echo "- Conflict preference: upstream"
            echo ""
            echo "Sync completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"
