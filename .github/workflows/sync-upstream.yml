
name: Sync SVT-AV1 Upstream (ChatGPT)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream repository
        run: |
          git remote add upstream \
            https://github.com/AOMediaCodec/SVT-AV1.git

      - name: Fetch repositories
        run: |
          git fetch origin
          git fetch upstream

      - name: Detect branches
        id: branches
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          UPSTREAM_BRANCH=$(git ls-remote --symref upstream HEAD |
            awk '/^ref:/ {
              sub("refs/heads/", "", $2)
              print $2
            }')

          if [ -z "$UPSTREAM_BRANCH" ]; then
            echo "Unable to detect upstream default branch"
            exit 1
          fi

          echo "default=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create sync branch
        run: |
          git checkout -B sync-upstream \
            "origin/${{ steps.branches.outputs.default }}"

      - name: Merge upstream
        env:
          UPSTREAM_BRANCH: ${{ steps.branches.outputs.upstream }}
        shell: bash
        run: |
          if git merge "upstream/$UPSTREAM_BRANCH" \
            --no-commit --no-ff -X theirs; then
            echo "Merge prepared successfully"
          else
            if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "Merge failed for a non-conflict reason"
              exit 1
            fi

            echo "Resolving remaining conflicts..."

            while IFS= read -r -d '' file; do
              if git checkout --theirs -- "$file"; then
                git add -- "$file"
              else
                git rm -f --ignore-unmatch -- "$file"
              fi
            done < <(git diff --name-only --diff-filter=U -z)
          fi

      - name: Preserve fork workflows
        env:
          DEFAULT_BRANCH: ${{ steps.branches.outputs.default }}
        run: |
          git restore \
            --source="origin/$DEFAULT_BRANCH" \
            --staged \
            --worktree \
            -- .github/workflows/

          git add -A

      - name: Create merge commit
        run: |
          git commit -m "Merge upstream SVT-AV1 changes"

      - name: Show changed files
        env:
          DEFAULT_BRANCH: ${{ steps.branches.outputs.default }}
        run: |
          echo "## Changed Files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          git diff --stat \
            "origin/$DEFAULT_BRANCH"...sync-upstream \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Detailed Diff" >> "$GITHUB_STEP_SUMMARY"

          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git diff --numstat \
            "origin/$DEFAULT_BRANCH"...sync-upstream \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Push sync branch
        run: |
          git push origin sync-upstream --force-with-lease

      - name: Generate summary
        run: |
          {
            echo "## SVT-AV1 Upstream Sync"
            echo ""
            echo "- Fork: atm3819/svt-av1-custom"
            echo "- Upstream: AOMediaCodec/SVT-AV1"
            echo "- Branch: sync-upstream"
            echo "- Conflict preference: upstream"
            echo "- Fork workflows: preserved"
            echo "- Default branch: untouched"
          } >> "$GITHUB_STEP_SUMMARY"
