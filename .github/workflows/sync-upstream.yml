
name: Sync with Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream to separate branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        env:
          UPSTREAM_REPO: https://github.com/UPSTREAM_OWNER/UPSTREAM_REPO.git
        run: |
          git remote add upstream "$UPSTREAM_REPO"

      - name: Fetch repositories
        run: |
          git fetch origin
          git fetch upstream

      - name: Create sync branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git checkout -B sync-upstream "origin/$DEFAULT_BRANCH"

      - name: Merge upstream with automatic conflict resolution
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge upstream/"$DEFAULT_BRANCH" \
            --no-edit \
            -X theirs

      - name: Push sync branch
        run: |
          git push origin sync-upstream --force-with-lease

